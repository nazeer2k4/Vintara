<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'League Spartan', sans-serif;
    }

    /* Navbar */
    .navbar {
      height: 75px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 10px 0px;
      background-color: #ffffff;
      color: #0c4833;
      border-bottom: 1px solid #eee;
    }

    /* Logo */
    .logo {
      display: flex;
      align-items: center;
      margin-left: 40px; 
      margin-right: 30px;
    }
    .logo img {
      width: 200px;
      height: auto;
    }

    /* Links */
    .nav-links {
      display: flex;
      gap: 30px;
      margin-left: 20px;
      margin-right: auto;
    }
    .nav-links a {
      text-decoration: none;
      color: #0a3d2e;
      font-size: 1.3rem;
      font-weight: 600;
      transition: color 0.3s;
    }
    .nav-links a:hover {
      color: #06291f;
    }

    /* Enquiry button */
    .enquiry-btn {
      border: 2px solid #0c4833;
      background: transparent;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      color: #0c4833;
      margin-right: 20px;
      font-size: large;
    }
    .enquiry-btn:hover {
      border-color: #176b4c;
      color: #176b4c;
    }

    /* Hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
      margin-left: 15px;
    }
    .hamburger span {
      width: 25px;
      height: 3px;
      background: #0c4833;
      border-radius: 5px;
    }

    /* Mobile menu (side drawer) */
    .mobile-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 40%;
      height: 100vh;
      background: #ffffff;
      box-shadow: -2px 0 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      padding-top: 80px;
      transition: right 0.3s ease-in-out;
      z-index: 999;
    }
    .mobile-menu a {
      padding: 15px 20px;
      text-decoration: none;
      color: #0c4833;
      font-size: 1.2rem;
      font-weight: 600;
      text-align: left;
      transition: color 0.2s;
    }
    .mobile-menu a:hover {
      color: #176b4c;
    }
    .mobile-menu .enquiry-btn {
      display: block;
      margin: 30px auto;
      width: 80%;
      align-self: center;
    }
    .mobile-menu.active {
      right: 0;
    }

    /* Mobile logo inside menu */
    .mobile-logo {
      text-align: center;
      padding: 20px 0 30px;
      border-bottom: 1px solid #eee;
    }
    .mobile-logo img {
      width: 140px;
      height: auto;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 998;
    }
    .overlay.active {
      display: block;
    }

    /* Responsive */
   @media (max-width: 768px) {
  .nav-links,
  .navbar .enquiry-btn {
    display: none;
  }

      .hamburger {
        display: flex;
        margin-left: auto;
        margin-right: 15px;
      }
      .logo {
        margin-left: 10px;
      }
      .logo img {
        width: 150px;
        height: auto;
      }
      .navbar {
        justify-content: space-between;
        padding: 0 10px;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <!-- Logo -->
    <div class="logo">
      <img src="/images/vintaraLogoGreen.svg" alt="Logo">
    </div>

    <!-- Links -->
    <div class="nav-links">
      <a href="/index.html">Home</a>
      <a href="/products-main.html">Products</a>
      <a href="/about.html">About Us</a>
      <a href="/blog.html">Blog</a>
    </div>

    <!-- Enquiry button -->
   <a href="/enquiry0.html">
  <button class="enquiry-btn">ENQUIRY</button>
</a>

    <!-- Hamburger -->
    <div class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </nav>

  <!-- Mobile menu -->
  <div class="mobile-menu" id="mobileMenu">
    <div class="mobile-logo">
      <img src="/images/vintaraLogoGreen.svg" alt="Logo">
    </div>
    <a href="/index.html">Home</a>
    <a href="/products-main.html">Products</a>
    <a href="/about.html">About Us</a>
    <a href="/blog.html">Blog</a>
   <a href="/enquiry0.html">
  <button class="enquiry-btn">ENQUIRY</button>
</a>
  </div>

  <!-- Overlay -->
  <div class="overlay" id="overlay"></div>

  <script>
    const hamburger = document.querySelector(".hamburger");
    const mobileMenu = document.getElementById("mobileMenu");
    const overlay = document.getElementById("overlay");

    hamburger.addEventListener("click", () => {
      mobileMenu.classList.toggle("active");
      overlay.classList.toggle("active");
      hamburger.classList.toggle("active");
    });

    overlay.addEventListener("click", () => {
      mobileMenu.classList.remove("active");
      overlay.classList.remove("active");
      hamburger.classList.remove("active");
    });
  </script>
</body>
</html>
